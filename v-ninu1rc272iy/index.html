<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>태국 여행 영상</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1d2a2a;--sub:#5d6b6b;--line:#e3ded2;--acc:#0f766e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1716;--card:#18221f;--ink:#eaf1ee;--sub:#a3b3ae;--line:#2a3733;--acc:#5eead4}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto}
h1{font-size:1.4rem;margin:8px 0 4px}
.sub{color:var(--sub);margin:0 0 20px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:16px}
.card h2{font-size:1.05rem;margin:4px 4px 2px}
.card p{margin:0 4px 10px;color:var(--sub);font-size:.92rem}
video{display:block;width:100%;border-radius:10px;background:#000;aspect-ratio:16/9}
.empty{padding:28px 12px;text-align:center;color:var(--sub)}
.note{font-size:.85rem;color:var(--sub);margin-top:20px}
</style>
</head>
<body>
<main>
<h1>태국 여행 영상</h1>
<p class="sub">재생 버튼을 누르면 그때 불러와요. 와이파이에서 보시길 권해요.</p>
<div id="list">
  <div class="card empty">영상을 준비하고 있어요.</div>
</div>
<p class="note">이 주소를 아는 분만 볼 수 있어요. 가족 밖으로 공유하지 말아 주세요.</p>
</main>
</body>
</html>
